else{g.save();g.translate(b.x,b.y);g.rotate(speed>200?Math.sin(t*15+b.id)*.14:Math.sin(t*1.7+b.id)*.05);if(phaseAt!==null)glow(0,0,46,'#fff5ac',.8);circle(2,5,b.r,'#526d512c');circle(0,0,b.r,c,'#445747',2.8);const afraid=enemies.some(e=>Math.hypot(b.x-e.x,b.y-e.y)<125),blink=Math.sin(t*2+b.blink)>.995;g.strokeStyle='#364b41';g.fillStyle='#364b41';g.lineWidth=2.2;for(const x of [-7,7]){if(b.mood>.1&&phaseAt===null){line(x-3,-6,x+3,0,'#364b41',2);line(x+3,-6,x-3,0,'#364b41',2)}else if(blink||phaseAt!==null){g.beginPath();g.arc(x,-1,4,Math.PI,2*Math.PI);g.stroke()}else circle(x,-4,afraid?4:2.7,'#364b41')}

function drawLauncher(){const x=W*.5,y=H-100+recoil;if(drag){g.beginPath();g.moveTo(x,y);g.arc(x,y,130,aim-.16,aim+.16);g.closePath();g.fillStyle=MODE==='C'?'#5f83652a':'#c5e9be16';g.fill();g.strokeStyle=MODE==='C'?'#59795c66':'#d9efcb55';g.lineWidth=1;g.stroke()}if(MODE!=='C')glow(x,y,55,palette[(nextId-1)%3],.25+Math.sin(t*2)**2*.1);circle(x,y,27,null,MODE==='C'?'#45664f':'#b4d3bb',2);circle(x,y,20,MODE==='C'?'#faf4dd':'#14252a',palette[(nextId-1)%3],2);g.save();g.translate(x,y);g.rotate(aim+Math.PI/2);g.beginPath();g.moveTo(-6,4);g.lineTo(0,-6);g.lineTo(6,4);g.strokeStyle=MODE==='C'?'#45664f':'#d9efcb';g.lineWidth=2;g.stroke();g.restore()}
function drawHero(){if(!hero)return;const cardW=Math.min(330,W-70),x=W-cardW-40,y=45;g.save();g.translate(x,y);g.fillStyle='#fffcf0';g.shadowColor='#4b55442c';g.shadowBlur=22;g.shadowOffsetY=8;g.beginPath();g.roundRect(0,0,cardW,156,14);g.fill();g.shadowColor='transparent';g.fillStyle='#4a624d';g.textAlign='left';g.font='600 15px "Microsoft JhengHei",sans-serif';g.fillText('今天的英雄',22,32);g.font='bold 29px "Microsoft JhengHei",sans-serif';g.fillText('#'+hero.id+' '+hero.name,22,76);g.font='16px "Microsoft JhengHei",sans-serif';g.fillText('撞了 '+hero.hits+' 次，點燃了 '+hero.lit+' 位夥伴',22,110);g.font='13px "Microsoft JhengHei",sans-serif';g.fillStyle='#657561';g.fillText('你送來的小傢伙，帶著大家一起上。',22,136);g.restore()}
function render(){g.setTransform(dpr*scale,0,0,dpr*scale,0,0);g.save();if(!reduced&&shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);background();for(const e of enemies)drawEnemy(e);for(const l of links){g.globalAlpha=l.life/.8*.65;line(l.a.x,l.a.y,l.b.x,l.b.y,palette[l.a.type],MODE==='C'?3:1.5)}g.globalAlpha=1;for(const w of waves){const p=1-w.life/w.max;g.globalAlpha=(1-p)*.75;circle(w.x,w.y,8+w.size*(1-Math.pow(1-p,2)),null,w.c,2.5*(1-p)+.5)}g.globalAlpha=1;for(const b of balls)drawBall(b);for(const p of sparks){g.globalAlpha=Math.min(1,p.life/.35);circle(p.x,p.y,p.r,p.c)}g.globalAlpha=1;for(const w of words){g.globalAlpha=Math.min(1,w.life*2);g.font='bold 16px "Microsoft JhengHei",sans-serif';g.textAlign='center';g.fillStyle=w.c;g.fillText(w.text,w.x,w.y)}g.globalAlpha=1;drawLauncher();g.restore();if(phaseAt!==null){if(MODE==='B'&&phaseAge<3.2){g.globalAlpha=(reduced?.45:1)*Math.max(0,1-phaseAge/3.2);g.fillStyle='#f5ffe9';g.fillRect(0,0,W,H);g.globalAlpha=1}else if(MODE==='A'&&phaseAge<2){g.globalAlpha=.16*(1-phaseAge/2);g.fillStyle='#b3ffdc';g.fillRect(0,0,W,H);g.globalAlpha=1}drawHero()}}
function frame(now){const dt=Math.min(.05,(now-lastFrame)/1000||.016);lastFrame=now;frameCount++;if(freeze>0){freeze-=dt}else{acc+=dt;while(acc>=1/120){update(1/120);acc-=1/120}}render();requestAnimationFrame(frame)}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;initAudio();canvas.classList.add('pointer-mode');canvas.focus();canvas.setPointerCapture(e.pointerId);drag=point(e);aim=-Math.PI/2});canvas.addEventListener('pointermove',e=>{if(!drag)return;const p=point(e),dx=p.x-drag.x,dy=p.y-drag.y;if(Math.hypot(dx,dy)>8)aim=Math.atan2(-Math.max(30,Math.abs(dy)),dx)});canvas.addEventListener('pointerup',e=>{if(!drag)return;drag=null;launch(aim)});canvas.addEventListener('pointercancel',()=>drag=null);canvas.addEventListener('lostpointercapture',()=>drag=null);addEventListener('keydown',e=>{canvas.classList.remove('pointer-mode');if(e.key.toLowerCase()==='r'){reset();return}if(e.key==='ArrowLeft'){aim=Math.max(-Math.PI+.3,aim-.12);e.preventDefault()}if(e.key==='ArrowRight'){aim=Math.min(-.3,aim+.12);e.preventDefault()}if(e.code==='Space'&&!e.repeat){e.preventDefault();launch(aim)}});addEventListener('resize',resize);addEventListener('blur',()=>drag=null);
